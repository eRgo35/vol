[package]
name = "vol"
version = "0.1.0"
description = "A simpler TUI version of pavucontrol"
authors = ["Michał Czyż <mike@c2yz.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
tokio = { version = "1.54.0", features = ["full"] }
color-eyre = "0.6.5"
strum = { version = "0.28.0", features = ["derive"] }
pipewire = "0.10.1"
